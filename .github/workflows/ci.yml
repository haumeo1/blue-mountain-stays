name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Syntax checks for every script plus browser/server import-boundary checks.
      - run: npm run check
      - run: npm test
      # The build scans dist/ for server-only environment values; no secrets are configured here.
      - run: npm run build
